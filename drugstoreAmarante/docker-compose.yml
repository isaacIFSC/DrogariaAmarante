services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: drugstoreamarante-db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Str0ngP@ssw0rd!123"
      MSSQL_PID: "Express"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: [ "CMD-SHELL", "bash -c 'cat < /dev/null > /dev/tcp/localhost/1433'" ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  app:
    build:
      context: .
    container_name: drugstoreamarante-app
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:sqlserver://db:1433;databaseName=drugstoreamarante;encrypt=true;trustServerCertificate=true
      SPRING_DATASOURCE_USERNAME: sa
      SPRING_DATASOURCE_PASSWORD: Str0ngP@ssw0rd!123
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      DROGARIA_ADMIN_EMAIL: ${DROGARIA_ADMIN_EMAIL:-}
      DROGARIA_ADMIN_PASSWORD: ${DROGARIA_ADMIN_PASSWORD:-}
      DROGARIA_ADMIN_CPF: ${DROGARIA_ADMIN_CPF:-}
      DROGARIA_ADMIN_PHONE: ${DROGARIA_ADMIN_PHONE:-}
    ports:
      - "8080:8080"

volumes:
  sqlserver_data:

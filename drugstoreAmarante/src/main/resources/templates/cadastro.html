<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DrogariaAmarante | Cadastro</title>
  <link rel="stylesheet" th:href="@{/css/styles.css}" href="/css/styles.css" />
</head>
<body class="auth-page">
  <header class="site-header" role="banner">
    <div class="container header-grid">
      <a class="logo" href="/" aria-label="DrogariaAmarante">
        <span class="logo-mark" aria-hidden="true">DA</span>
        <span class="logo-text">Drogaria<span>Amarante</span></span>
      </a>
      <div class="header-actions">
        <a class="text-link" th:href="@{/}">Home</a>
        <a class="text-link" th:href="@{/login}">Entrar como cliente</a>
      </div>
    </div>
  </header>

  <main class="auth-main" role="main">
    <section class="auth-card auth-card--wide" aria-label="Criar conta">
      <header class="auth-header">
        <h1>Criar conta de cliente</h1>
        <p>Cadastre-se para acessar o perfil e voltar ao fluxo da loja. O acesso administrativo e feito por URL.</p>
      </header>

      <div class="auth-alert auth-alert--error" th:if="${erroCadastro}" th:text="${erroCadastro}">
        Erro no cadastro.
      </div>

      <form class="auth-form auth-form--grid" th:action="@{/cadastro}" method="post" th:object="${user}">
        <input type="hidden" th:name="${csrf.parameterName}" th:value="${csrf.token}" />
        <label class="field">
          <span>Nome</span>
          <input type="text" th:field="*{firstName}" placeholder="Nome" required />
        </label>

        <label class="field">
          <span>Sobrenome</span>
          <input type="text" th:field="*{lastName}" placeholder="Sobrenome" required />
        </label>

        <label class="field">
          <span>Email</span>
          <input type="email" th:field="*{email}" placeholder="Email" required />
        </label>

        <label class="field">
          <span>Senha</span>
          <input type="password" th:field="*{password}" placeholder="Senha" required />
        </label>

        <label class="field">
          <span>CPF</span>
          <input type="text" th:field="*{cpf}" placeholder="Somente numeros" required />
        </label>

        <label class="field">
          <span>Telefone</span>
          <input type="text" th:field="*{phone}" placeholder="Telefone" required />
        </label>

        <label class="field">
          <span>Genero</span>
          <select th:field="*{gender}" required>
            <option value="" disabled selected>Selecione</option>
            <option value="Masculino">Masculino</option>
            <option value="Feminino">Feminino</option>
            <option value="Outro">Outro</option>
            <option value="Prefiro não informar">Prefiro não informar</option>
          </select>
        </label>

        <label class="field">
          <span>Data de nascimento</span>
          <input type="date" th:field="*{birthDate}" required />
        </label>

        <button type="submit" class="btn-primary field-wide">Cadastrar</button>
      </form>

      <div class="auth-footer">
        <span>Ja tem conta?</span>
        <a th:href="@{/login}" class="link">Voltar para login de cliente</a>
      </div>
    </section>
  </main>
</body>
</html>

<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DrogariaAmarante | Perfil</title>
  <link rel="stylesheet" th:href="@{/css/styles.css}" href="/css/styles.css" />
</head>
<body class="auth-page">
  <header class="site-header" role="banner">
    <div class="container header-grid">
      <a class="logo" href="/" aria-label="DrogariaAmarante">
        <span class="logo-mark" aria-hidden="true">DA</span>
        <span class="logo-text">Drogaria<span>Amarante</span></span>
      </a>
      <div class="header-actions">
        <a class="text-link" th:href="@{/}">Home</a>
        <a class="text-link text-link--accent" th:href="@{/admin/produtos}">Cadastrar produto</a>
        <a class="text-link" th:href="@{/logout}">Sair</a>
      </div>
    </div>
  </header>

  <main class="auth-main" role="main">
    <section class="auth-card auth-card--wide" aria-label="Perfil do usuario">
      <header class="auth-header">
        <h1>Meu perfil</h1>
        <p>Confira os dados da sua conta e siga para a loja ou para a area administrativa.</p>
      </header>

      <div class="profile-grid">
        <div class="profile-block">
          <span class="profile-label">Nome</span>
          <strong th:text="${user.firstName}">Nome</strong>
        </div>
        <div class="profile-block">
          <span class="profile-label">Sobrenome</span>
          <strong th:text="${user.lastName}">Sobrenome</strong>
        </div>
        <div class="profile-block">
          <span class="profile-label">Email</span>
          <strong th:text="${user.email}">email@exemplo.com</strong>
        </div>
        <div class="profile-block">
          <span class="profile-label">CPF</span>
          <strong th:text="${user.cpf}">00000000000</strong>
        </div>
        <div class="profile-block">
          <span class="profile-label">Telefone</span>
          <strong th:text="${user.phone}">000000000</strong>
        </div>
        <div class="profile-block">
          <span class="profile-label">Nascimento</span>
          <strong th:text="${user.birthDate}">2000-01-01</strong>
        </div>
      </div>

      <div class="auth-footer auth-footer--column">
        <a th:href="@{/admin/produtos}" class="btn-secondary">Ir para cadastro de produto</a>
        <a th:href="@{/}" class="link">Voltar para a home</a>
      </div>
    </section>
  </main>
</body>
</html>

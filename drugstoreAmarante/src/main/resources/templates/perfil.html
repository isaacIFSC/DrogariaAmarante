<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Drogaria Amarante | Meu Perfil & Pedidos</title>
  <link rel="stylesheet" th:href="@{/css/styles.css}" href="/css/styles.css" />
</head>
<body class="auth-page">
  <header class="site-header" role="banner">
    <div class="container header-grid">
      <a class="logo" href="/" aria-label="DrogariaAmarante">
        <span class="logo-mark" aria-hidden="true">DA</span>
        <span class="logo-text">Drogaria<span>Amarante</span></span>
      </a>
      <div class="header-actions">
        <a class="text-link" th:href="@{/}">Loja</a>
        <a class="text-link" th:href="@{/carrinho}">Carrinho</a>
        <form th:action="@{/logout}" method="post" style="display:inline-flex"><input type="hidden" th:name="${csrf.parameterName}" th:value="${csrf.token}" /><button class="text-link" type="submit" style="border:0;background:transparent;cursor:pointer;font:inherit">Sair</button></form>
      </div>
    </div>
  </header>

  <main class="auth-main" role="main">
    <div class="container">
      <section class="auth-card auth-card--wide" aria-label="Perfil do usuário">
        <header class="auth-header">
          <h1>Meu Perfil</h1>
          <p>Seus dados cadastrais e histórico de pedidos na Drogaria Amarante.</p>
        </header>

        <div class="profile-grid">
          <div class="profile-block">
            <span class="profile-label">Nome</span>
            <strong th:text="${user.firstName}">Nome</strong>
          </div>
          <div class="profile-block">
            <span class="profile-label">Sobrenome</span>
            <strong th:text="${user.lastName}">Sobrenome</strong>
          </div>
          <div class="profile-block">
            <span class="profile-label">Email</span>
            <strong th:text="${user.email}">email@exemplo.com</strong>
          </div>
          <div class="profile-block">
            <span class="profile-label">CPF</span>
            <strong th:text="${user.cpf}">00000000000</strong>
          </div>
          <div class="profile-block">
            <span class="profile-label">Telefone</span>
            <strong th:text="${user.phone}">000000000</strong>
          </div>
        </div>

        <hr style="margin: 2rem 0; border: none; border-top: 1px solid var(--brand-gray);" />

        <div class="my-orders-section">
          <h2>Meus Pedidos Recentes</h2>
          <div id="meus-pedidos-container">
            <p style="color: var(--muted);">Carregando seus pedidos...</p>
          </div>
        </div>

        <div class="auth-footer auth-footer--column" style="margin-top: 2rem;">
          <a th:href="@{/}" class="btn-primary" style="display: inline-block; text-align: center;">Ir Comprar na Loja</a>
        </div>
      </section>
    </div>
  </main>

  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const escapeHtml = (value) => String(value ?? '').replace(/[&<>"']/g, (char) => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
      })[char]);
      const container = document.getElementById('meus-pedidos-container');
      if (!container) return;

      try {
        const res = await fetch('/api/checkout/meus-pedidos', { headers: { Accept: 'application/json' } });
        if (!res.ok) throw new Error('Falha ao carregar pedidos');
        const pedidos = await res.json();

        if (!pedidos || pedidos.length === 0) {
          container.innerHTML = '<p class="text-muted">Você ainda não realizou nenhum pedido.</p>';
          return;
        }

        container.innerHTML = pedidos.map(p => `
          <div class="order-history-card">
            <div class="order-history-header">
              <div>
                <strong>Código: ${escapeHtml(p.codigoRastreio)}</strong>
                <span class="order-date">${escapeHtml(p.dataCriacaoFormatada)}</span>
              </div>
              <span class="status-badge">${escapeHtml(p.statusDescricao)}</span>
            </div>
            <div class="order-history-body">
              <p><strong>Forma de Pagamento:</strong> ${escapeHtml(p.formaPagamento)}</p>
              <p><strong>Total:</strong> ${escapeHtml(p.totalFormatado)}</p>
              <p><strong>Entrega:</strong> ${escapeHtml(p.enderecoCompleto)}</p>
            </div>
          </div>
        `).join('');
      } catch (err) {
        container.innerHTML = '<p class="text-muted">Não foi possível carregar seu histórico de pedidos.</p>';
      }
    });
  </script>
</body>
</html>
